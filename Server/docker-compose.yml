services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: steading-server:dev
    container_name: steading-server
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    volumes:
      - ./world_data:/app/world_data
      - ./logs:/app/logs
    environment:
      STEADING_PORT: "7777"
      STEADING_WORLD_NAME: "default"
    stdin_open: true
    tty: true
